name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach APKs to (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Configure Gradle & Build APKs (Debug & Release)
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-easy-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APKs directly to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          echo "Target tag: $TAG_NAME"

          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/UPIEasy-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/UPIEasy-${TAG_NAME}-debug.apk"

          echo "Checking release $TAG_NAME..."
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME does not exist. Creating it with APK assets..."
            gh release create "$TAG_NAME" release-assets/*.apk \
              --title "UPI-Easy $TAG_NAME" \
              --generate-notes
          else
            echo "Release $TAG_NAME exists. Uploading APK assets directly..."
            gh release upload "$TAG_NAME" release-assets/*.apk --clobber
          fi
