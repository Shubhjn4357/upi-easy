name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Publish GitHub Release with APK artifacts"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TARGET_TRACK: ${{ vars.TARGET_TRACK || 'internal' }}
  TARGET_STATUS: ${{ vars.TARGET_STATUS || 'completed' }}
  ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.aerotech.upieasy' }}

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Configure Gradle & Build APKs (Debug & Release)
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Calculate release & debug signing & checksums
        id: signing
        run: |
          RELEASE_APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "source=release-keystore" >> "$GITHUB_OUTPUT"
            echo "sha1=$(sha1sum "$RELEASE_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "sha256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "source=release-output" >> "$GITHUB_OUTPUT"
            echo "sha1=none" >> "$GITHUB_OUTPUT"
            echo "sha256=none" >> "$GITHUB_OUTPUT"
          fi

          DEBUG_APK=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "debug_sha1=$(sha1sum "$DEBUG_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "debug_sha256=$(sha256sum "$DEBUG_APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          else
            echo "debug_sha1=none" >> "$GITHUB_OUTPUT"
            echo "debug_sha256=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Export release & debug metadata
        run: |
          mkdir -p build-metadata
          {
            echo "track=${TARGET_TRACK}"
            echo "status=${TARGET_STATUS}"
            echo "keystore_source=${{ steps.signing.outputs.source }}"
            echo "release_sha1=${{ steps.signing.outputs.sha1 }}"
            echo "release_sha256=${{ steps.signing.outputs.sha256 }}"
            echo "debug_sha1=${{ steps.signing.outputs.debug_sha1 }}"
            echo "debug_sha256=${{ steps.signing.outputs.debug_sha256 }}"
            echo "git_ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
          } > build-metadata/android-release-details.txt
          {
            echo "### Android Build Outputs (Debug & Release)"
            echo ""
            cat build-metadata/android-release-details.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release details artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-details
          path: build-metadata/android-release-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release with APK artifacts
        id: gh_release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_github_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-v{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Android {0}', github.ref_name) || format('Android Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-metadata/android-release-details.txt

      - name: Add GitHub release link to summary
        if: ${{ steps.gh_release.outputs.url != '' }}
        shell: bash
        run: |
          {
            echo ""
            echo "### GitHub Release"
            echo "- URL: ${{ steps.gh_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
