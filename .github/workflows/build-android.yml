name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Build Android APKs (Debug & Release)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upi-easy-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APKs to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "Checking release $TAG_NAME..."
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME does not exist yet. Creating it..."
            gh release create "$TAG_NAME" --title "UPI-Easy $TAG_NAME" --generate-notes
          fi
          echo "Publishing APK assets to release $TAG_NAME..."
          gh release upload "$TAG_NAME" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber

