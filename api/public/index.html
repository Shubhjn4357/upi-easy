/* UPI-Easy SaaS Dashboard — shadcn/ui Design Tokens & Theme System (Dark & Light) */

:root {
  /* shadcn/ui Official Light Mode Tokens */
  --background: 0 0% 100%;
  --foreground: 222.2 84% 4.9%;
  --card: 0 0% 100%;
  --card-foreground: 222.2 84% 4.9%;
  --popover: 0 0% 100%;
  --popover-foreground: 222.2 84% 4.9%;
  --primary: 243.4 75.4% 58.6%;
  --primary-foreground: 210 40% 98%;
  --secondary: 210 40% 96.1%;
  --secondary-foreground: 222.2 47.4% 11.2%;
  --muted: 210 40% 96.1%;
  --muted-foreground: 215.4 16.3% 46.9%;
  --accent: 210 40% 96.1%;
  --accent-foreground: 222.2 47.4% 11.2%;
  --destructive: 0 84.2% 60.2%;
  --destructive-foreground: 210 40% 98%;
  --border: 214.3 31.8% 91.4%;
  --input: 214.3 31.8% 91.4%;
  --ring: 243.4 75.4% 58.6%;
  --radius: 0.75rem;

  /* Legacy aliases for backward compatibility */
  --bg-primary: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-card: rgba(255, 255, 255, 0.88);
  --border-color: rgba(226, 232, 240, 0.9);
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --sheet-bg: #FFFFFF;
  --sheet-handle: #CBD5E1;
}

html.dark {
  /* shadcn/ui Official Dark Mode Tokens */
  --background: 224 71% 4%;
  --foreground: 210 40% 98%;
  --card: 224 71% 5.5%;
  --card-foreground: 210 40% 98%;
  --popover: 224 71% 4%;
  --popover-foreground: 210 40% 98%;
  --primary: 238.7 83.5% 66.7%;
  --primary-foreground: 222.2 47.4% 1.2%;
  --secondary: 217.2 32.6% 12.5%;
  --secondary-foreground: 210 40% 98%;
  --muted: 217.2 32.6% 12.5%;
  --muted-foreground: 215 20.2% 65.1%;
  --accent: 217.2 32.6% 12.5%;
  --accent-foreground: 210 40% 98%;
  --destructive: 0 62.8% 40.6%;
  --destructive-foreground: 210 40% 98%;
  --border: 217.2 32.6% 17.5%;
  --input: 217.2 32.6% 17.5%;
  --ring: 238.7 83.5% 66.7%;

  /* Legacy aliases for backward compatibility */
  --bg-primary: #090D16;
  --bg-surface: #111827;
  --bg-card: rgba(17, 24, 39, 0.76);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --sheet-bg: #111827;
  --sheet-handle: #475569;
}

body {
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  transition: background-color 0.25s ease, color 0.25s ease;
  min-height: 100vh;
}

html.dark body {
  background-image: 
    radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 55%),
    radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.10) 0px, transparent 50%),
    radial-gradient(at 50% 100%, rgba(139, 92, 246, 0.06) 0px, transparent 50%);
  background-attachment: fixed;
}

html.light body {
  background-image: 
    radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 55%),
    radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.04) 0px, transparent 50%);
  background-attachment: fixed;
}

/* Animations */
@keyframes bottomSheetUp {
  from { transform: translateY(100%); opacity: 0.5; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.animate-bottom-sheet-up {
  animation: bottomSheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.animate-fade-in {
  animation: fadeIn 0.2s ease-out forwards;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: hsl(var(--border));
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: hsl(var(--muted-foreground));
}
