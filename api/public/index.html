const { useState, useEffect, useMemo, useRef, Suspense, startTransition } = React;

/* --- auth.js --- */
// Security & Authentication Utilities
function parseJwtPayload(token) {
  if (!token || typeof token !== "string") return null;
  try {
    const parts = token.split(".");
    if (parts.length !== 3) return null;
    const base64Url = parts[1];
    const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
    const jsonPayload = decodeURIComponent(
      atob(base64)
        .split("")
        .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
        .join("")
    );
    return JSON.parse(jsonPayload);
  } catch {
    return null;
  }
}

function isTokenExpired(token) {
  const payload = parseJwtPayload(token);
  if (!payload || !payload.exp) return false;
  // Buffer of 10 seconds to prevent edge-case race conditions
  return Date.now() >= (payload.exp - 10) * 1000;
}

function getStoredAuth() {
  const token = localStorage.getItem("upieasy_token");
  if (!token) return { token: "", user: null };

  if (isTokenExpired(token)) {
    clearAuth();
    return { token: "", user: null };
  }

  const savedUser = localStorage.getItem("upieasy_user");
  let user = null;
  try {
    user = savedUser ? JSON.parse(savedUser) : null;
  } catch {
    user = null;
  }

  return { token, user };
}

function saveAuth(token, user) {
  if (token) localStorage.setItem("upieasy_token", token);
  if (user) localStorage.setItem("upieasy_user", JSON.stringify(user));
}

function clearAuth() {
  localStorage.removeItem("upieasy_token");
  localStorage.removeItem("upieasy_user");
  localStorage.removeItem("upieasy_active_org_id");
}

function sanitizeUrl(url) {
  if (!url) return "#";
  const trimmed = url.trim().toLowerCase();
  if (
    trimmed.startsWith("javascript:") ||
    trimmed.startsWith("data:") ||
    trimmed.startsWith("vbscript:")
  ) {
    return "#";
  }
  return url;
}

function hasRole(currentRole, requiredRole) {
  const hierarchy = { OWNER: 4, MANAGER: 3, CASHIER: 2, MEMBER: 1 };
  const currentLevel = hierarchy[currentRole?.toUpperCase()] || 0;
  const requiredLevel = hierarchy[requiredRole?.toUpperCase()] || 0;
  return currentLevel >= requiredLevel;
}


/* --- api.js --- */
// Authenticated Secure API Client

function createApiClient(getToken, onUnauthorized, onLatency) {
  return async function apiFetch(endpoint, options = {}) {
    const token = typeof getToken === 'function' ? getToken() : getToken;

    // Check client-side expiration before dispatching
    if (token && isTokenExpired(token)) {
      clearAuth();
      onUnauthorized?.();
      throw new Error("Session expired. Please sign in again.");
    }

    const headers = {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    };

    const startTime = performance.now();
    try {
      const res = await fetch(`${window.location.origin}${endpoint}`, {
        ...options,
        headers,
      });

      const latency = Math.round(performance.now() - startTime);
      onLatency?.(latency);

      // Automatic 401 Unauthorized handling
      if (res.status === 401) {
        clearAuth();
        onUnauthorized?.();
        throw new Error("Unauthorized session. Please sign in again.");
      }

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || data.message || `Request failed with status ${res.status}`);
      }
      return data;
    } catch (err) {
      const latency = Math.round(performance.now() - startTime);
      onLatency?.(latency);
      throw err;
    }
  };
}


/* --- router.jsx --- */
// Lightweight Declarative React Router with Security Guards


const RouterContext = createContext({
  path: "/overview",
  navigate: () => {},
});

function Router({ children }) {
  // Sync with window.location.hash (e.g. #/overview, #/transactions) or default to /overview
  const getInitialPath = () => {
    const hash = window.location.hash.replace(/^#\/?/, "/");
    return hash && hash !== "/" ? hash : "/overview";
  };

  const [path, setPath] = useState(getInitialPath);

  useEffect(() => {
    const handleHashChange = () => {
      const newPath = window.location.hash.replace(/^#\/?/, "/");
      setPath(newPath && newPath !== "/" ? newPath : "/overview");
    };

    window.addEventListener("hashchange", handleHashChange);
    return () => window.removeEventListener("hashchange", handleHashChange);
  }, []);

  const navigate = (newPath) => {
    const normalized = newPath.startsWith("/") ? newPath : `/${newPath}`;
    window.location.hash = `#${normalized}`;
    setPath(normalized);
  };

  return (
    <RouterContext.Provider value={{ path, navigate }}>
      {children}
    </RouterContext.Provider>
  );
}

function useNavigate() {
  const context = useContext(RouterContext);
  return context.navigate;
}

function useLocation() {
  const context = useContext(RouterContext);
  return { pathname: context.path };
}

function Routes({ children }) {
  const { path } = useContext(RouterContext);
  let matchedElement = null;

  React.Children.forEach(children, (child) => {
    if (!React.isValidElement(child)) return;
    if (child.props.path === path || (child.props.path === "*" && !matchedElement)) {
      matchedElement = child.props.element;
    }
  });

  return matchedElement;
}

function Route({ path, element }) {
  return element;
}

function ProtectedRoute({
  isAuthenticated,
  userRole,
  requiredRole,
  fallback,
  children,
}) {
  if (!isAuthenticated) {
    return (
      <div className="p-8 text-center text-muted-foreground">
        <p className="font-semibold text-sm text-foreground">Authentication Required</p>
        <p className="text-xs mt-1">Please sign in to access this section.</p>
      </div>
    );
  }

  if (requiredRole && !hasRole(userRole, requiredRole)) {
    return (
      <div className="p-8 text-center text-muted-foreground">
        <p className="font-semibold text-sm text-destructive">Access Restricted</p>
        <p className="text-xs mt-1">
          Your role ({userRole || "MEMBER"}) lacks permission for this view. Requires {requiredRole}.
        </p>
      </div>
    );
  }

  return children;
}

function Link({ to, className = "", children, ...props }) {
  const navigate = useNavigate();
  return (
    <a
      href={`#${to.startsWith("/") ? to : `/${to}`}`}
      onClick={(e) => {
        e.preventDefault();
        navigate(to);
      }}
      className={className}
      {...props}>
      {children}
    </a>
  );
}

/* --- button.jsx --- */
// shadcn/ui Button component

function Button({
  className = "",
  variant = "default",
  size = "default",
  type = "button",
  children,
  disabled = false,
  ...props
}) {
  const baseClasses =
    "inline-flex items-center justify-center whitespace-nowrap rounded-xl text-xs font-semibold ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 select-none";

  const variantClasses = {
    default:
      "bg-primary text-primary-foreground hover:bg-primary/90 shadow-sm",
    destructive:
      "bg-destructive text-destructive-foreground hover:bg-destructive/90 shadow-sm",
    outline:
      "border border-input bg-background hover:bg-accent hover:text-accent-foreground",
    secondary:
      "bg-secondary text-secondary-foreground hover:bg-secondary/80",
    ghost:
      "hover:bg-accent hover:text-accent-foreground",
    link:
      "text-primary underline-offset-4 hover:underline",
    brand:
      "bg-brand-600 hover:bg-brand-500 text-white shadow-md shadow-brand-500/20",
  };

  const sizeClasses = {
    default: "h-9 px-4 py-2",
    sm: "h-8 rounded-lg px-3 text-[11px]",
    lg: "h-10 rounded-xl px-8 text-sm",
    icon: "h-9 w-9 p-0",
  };

  const vClass = variantClasses[variant] || variantClasses.default;
  const sClass = sizeClasses[size] || sizeClasses.default;

  return (
    <button
      type={type}
      disabled={disabled}
      className={`${baseClasses} ${vClass} ${sClass} ${className}`}
      {...props}>
      {children}
    </button>
  );
}

      })}
    </div>

function TabsList({ className = "", activeTab, setActiveTab, children }) {
  return (
    <div
      className={`inline-flex h-10 items-center justify-center rounded-xl bg-muted p-1 text-muted-foreground ${className}`}>
      {React.Children.map(children, (child) => {
        if (!child) return null;
        return React.cloneElement(child, { activeTab, setActiveTab });
      })}
    </div>
  );
}

function TabsTrigger({
  value,
  activeTab,
  setActiveTab,
  className = "",
  children,
  ...props
}) {
  const isSelected = activeTab === value;
  return (
    <button
      type="button"
      role="tab"
      aria-selected={isSelected}
      onClick={() => setActiveTab?.(value)}
      className={`inline-flex items-center justify-center whitespace-nowrap rounded-lg px-3 py-1.5 text-xs font-semibold ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 ${
        isSelected
          ? "bg-background text-foreground shadow-sm"
          : "hover:text-foreground"
      } ${className}`}
      {...props}>
      {children}
    </button>
  );
}

function TabsContent({ value, activeTab, className = "", children }) {
  if (activeTab !== value) return null;
  return (
    <div
      role="tabpanel"
      className={`ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ${className}`}>
      {children}
    </div>
  );
}

/* --- BottomSheet.jsx --- */
// shadcn/ui Action Bottom Sheet / Drawer Component




function renderActionIcon(icon) {
  if (!icon) return null;
  if (React.isValidElement(icon)) return icon;
  if (typeof icon === 'function') return React.createElement(icon, { className: "w-4 h-4 text-muted-foreground" });
  return <span className="text-sm">{icon}</span>;
}

function BottomSheet({ isOpen, onClose, title, subtitle, actions = [], children }) {
  if (!isOpen) return null;

  return (
    <Sheet open={isOpen} onOpenChange={(open) => !open && onClose()}>
      <SheetContent side="bottom" className="sm:max-w-lg sm:mx-auto sm:rounded-2xl sm:bottom-6 sm:border">
        {/* Header */}
        <SheetHeader className="pb-3 border-b border-border flex flex-row items-center justify-between">
          <div>
            <SheetTitle>{title}</SheetTitle>
            {subtitle && <SheetDescription>{subtitle}</SheetDescription>}
          </div>
          <Button
            variant="ghost"
            size="icon"
            onClick={onClose}
            className="h-8 w-8 rounded-lg text-muted-foreground hover:text-foreground">
            <IconX className="w-4 h-4" />
          </Button>
        </SheetHeader>

        {/* Action Buttons List */}
        {actions.length > 0 && (
          <div className="py-3 space-y-2">
            {actions.map((act, i) => (
              <Button
                key={i}
                variant={
                  act.variant === "danger"
                    ? "destructive"
                    : act.variant === "success"
                    ? "outline"
                    : "secondary"
                }
                onClick={() => {
                  onClose();
                  act.onClick();
                }}
                className={`w-full justify-between h-10 px-4 rounded-xl ${
                  act.variant === "success"
                    ? "border-emerald-500/20 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20"
                    : ""
                }`}>
                <div className="flex items-center gap-2.5">
                  <span className="flex items-center justify-center w-5 h-5">{renderActionIcon(act.icon)}</span>
                  <span>{act.label}</span>
                </div>
                <IconArrowUpRight className="w-3.5 h-3.5 opacity-60" />
              </Button>
            ))}
          </div>
        )}

        {/* Custom Body Content */}
        {children && (
          <div className="py-2 overflow-y-auto max-h-[60vh]">{children}</div>
        )}
      </SheetContent>
    </Sheet>
  );
}

/* --- LoginPage.jsx --- */
// Authentication Page: Official Google Sign-In using shadcn/ui
function LoginPage({ onLoginSuccess, theme, onToggleTheme, pingMs }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [showManualToken, setShowManualToken] = useState(false);
  const [manualTokenInput, setManualTokenInput] = useState("");
  const googleBtnRef = useRef(null);

  // Initialize Google Identity Services (GSI)
  useEffect(() => {
    const initGoogleGsi = () => {
      if (window.google?.accounts?.id) {
        const clientId = window.GOOGLE_CLIENT_ID || "1029384756-mock.apps.googleusercontent.com";

        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: async (response) => {
            if (response.credential) {
              await submitGoogleIdToken(response.credential);
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true,
        });

        if (googleBtnRef.current) {
          googleBtnRef.current.innerHTML = "";
          window.google.accounts.id.renderButton(googleBtnRef.current, {
            theme: theme === "dark" ? "filled_black" : "outline",
            size: "large",
            shape: "pill",
            width: 320,
            text: "signin_with",
            logo_alignment: "center",
          });
        }
      }
    };

    const timer = setTimeout(initGoogleGsi, 200);
    return () => clearTimeout(timer);
  }, [theme]);

  // Submit verified Google ID token to backend
  const submitGoogleIdToken = async (idToken) => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(`${window.location.origin}/api/v1/auth/google`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          idToken,
          deviceId: "web-saas-dashboard",
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || data.message || "Google authentication failed");
      }

      onLoginSuccess(data.tokens.accessToken, data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative bg-background transition-colors">
      {/* Top right theme toggle */}
      <div className="absolute top-4 right-4">
        <Button
          variant="outline"
          size="sm"
          onClick={onToggleTheme}
          className="rounded-xl gap-1.5 text-xs">
          {theme === "dark" ? (
            <>
              <IconSun className="w-3.5 h-3.5 text-amber-400" />
              <span>Light</span>
            </>
          ) : (
            <>
              <IconMoon className="w-3.5 h-3.5 text-indigo-500" />
              <span>Dark</span>
            </>
          )}
        </Button>
      </div>

      <Card className="w-full max-w-sm rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        {/* Brand Header */}
        <CardHeader className="text-center p-0 pb-6">
          <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center mx-auto shadow-md shadow-brand-500/25 mb-4">
            <span className="text-xl font-black text-white tracking-tight">UPI</span>
          </div>
          <CardTitle className="text-xl font-extrabold tracking-tight">
            UPI-Easy SaaS Console
          </CardTitle>
          <CardDescription className="text-xs mt-1">
            Enterprise Merchant Multi-Tenant Gateway
          </CardDescription>
        </CardHeader>

        <CardContent className="p-0 space-y-4">
          {/* Server Status Indicator */}
          <div className="p-2.5 rounded-xl bg-muted/50 border border-border flex items-center justify-between text-[11px] text-muted-foreground">
            <span className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Production API Gateway
            </span>
            <span className="font-mono text-emerald-600 dark:text-emerald-400 font-semibold">
              {pingMs ? `${pingMs}ms` : "Active"}
            </span>
          </div>

          {error && (
            <Alert variant="destructive">
              <AlertDescription>{error}</AlertDescription>
            </Alert>
          )}

          {/* Official Google GSI Container */}
          <div className="flex justify-center min-h-[44px]">
            <div ref={googleBtnRef} className="flex justify-center w-full"></div>
          </div>

          {/* Fallback Direct Google One-Tap Trigger */}
          <Button
            variant="outline"
            onClick={() => {
              if (window.google?.accounts?.id) {
                window.google.accounts.id.prompt((notification) => {
                  if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    setShowManualToken(true);
                  }
                });
              } else {
                setShowManualToken(true);
              }
            }}
            disabled={loading}
            className="w-full justify-center rounded-xl text-xs font-semibold">
            Prompt Google One-Tap
          </Button>

          <div className="pt-2 text-center">
            <button
              onClick={() => setShowManualToken(!showManualToken)}
              className="text-[11px] text-muted-foreground hover:text-foreground transition font-medium">
              {showManualToken ? "Hide Direct Token Input" : "Sign in with Google Token or API Key →"}
            </button>
          </div>

          {/* Manual Google ID Token Input */}
          {showManualToken && (
            <form
              onSubmit={async (e) => {
                e.preventDefault();
                if (!manualTokenInput.trim()) return;
                await submitGoogleIdToken(manualTokenInput.trim());
              }}
              className="space-y-2 pt-1 animate-fade-in">
              <Input
                type="text"
                value={manualTokenInput}
                onChange={(e) => setManualTokenInput(e.target.value)}
                placeholder="Paste Google ID Token or JWT"
                className="font-mono text-xs"
              />
              <Button
                type="submit"
                variant="brand"
                disabled={loading}
                className="w-full text-xs font-bold">
                {loading ? "Authenticating..." : "Submit Token"}
              </Button>
            </form>
          )}
        </CardContent>

        <div className="mt-8 text-center text-[10px] text-muted-foreground flex items-center justify-center gap-1.5">
          <IconLock className="w-3 h-3" />
          <span>Protected by Google OAuth 2.0 & HMAC-SHA256 Encryption</span>
        </div>
      </Card>
    </div>
  );
}

// Main Application: Clean, Secure, Declarative React Router Architecture






















  IconQrCode,

  IconStar,
  IconTrash2,

  IconCopy,
  IconEye,
  IconArrowUpRight,
  IconLandmark,
  IconBuilding,
  IconDatabase,
  IconHeartPulse,
} from './components/ui/icons.jsx';

function AppContent() {
  const navigate = useNavigate();
  const location = useLocation();

  // Active tab derived cleanly from router pathname
  const activeTab = location.pathname.replace(/^\//, '') || "overview";

  // Theme State
  const [theme, setTheme] = useState(() => localStorage.getItem("upieasy_theme") || "dark");
  useEffect(() => {
    const root = document.documentElement;
    if (theme === "dark") {
      root.classList.add("dark");
      root.classList.remove("light");
    } else {
      root.classList.remove("dark");
      root.classList.add("light");
    }
    localStorage.setItem("upieasy_theme", theme);
  }, [theme]);

  // Auth State & Token Expiration Guard
  const [auth, setAuth] = useState(() => getStoredAuth());
  const token = auth.token;
  const user = auth.user;

  // Multi-Tenant Org State
  const [organizations, setOrganizations] = useState([]);
  const [activeOrg, setActiveOrg] = useState(null);

  // Real-Time Telemetry State
  const [pingMs, setPingMs] = useState(null);
  const [isSyncing, setIsSyncing] = useState(false);

  // Entities
  const [dashboardStats, setDashboardStats] = useState(null);
  const [transactions, setTransactions] = useState([]);
  const [txnLoading, setTxnLoading] = useState(false);
  const [txnSearch, setTxnSearch] = useState("");
  const [txnStatus, setTxnStatus] = useState("");

  const [upiAccounts, setUpiAccounts] = useState([]);
  const [staffList, setStaffList] = useState([]);
  const [invitesList, setInvitesList] = useState([]);
  const [bankAccounts, setBankAccounts] = useState([]);

  // Database Tables State (Admin)
  const [adminTables, setAdminTables] = useState([]);
  const [selectedTable, setSelectedTable] = useState("transactions");
  const [tableData, setTableData] = useState({ rows: [], columns: [], total: 0 });
  const [tableLoading, setTableLoading] = useState(false);
  const [tableSearch, setTableSearch] = useState("");
  const [tableOffset, setTableOffset] = useState(0);

  // Health
  const [healthData, setHealthData] = useState(null);

  // Modals & Sheets
  const [bottomSheetConfig, setBottomSheetConfig] = useState(null);
  const [showNewTxnModal, setShowNewTxnModal] = useState(false);
  const [showUpiModal, setShowUpiModal] = useState(null); // null = closed, {} = new, { ...upi } = edit
  const [showQrModal, setShowQrModal] = useState(null);
  const [showStaffModal, setShowStaffModal] = useState(null); // null = closed, {} = new, { ...member } = edit
  const [showNewBankModal, setShowNewBankModal] = useState(false);
  const [showTableRowModal, setShowTableRowModal] = useState(null); // null = closed, { mode: 'insert'|'edit', row }
  const [inspectTxn, setInspectTxn] = useState(null);

  // Toast
  const [toast, setToast] = useState(null);
  const showToast = (message, type = "success") => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 3500);
  };

  // Secure API Client with auto 401 logout & latency tracking
  const apiFetch = useMemo(() => {
    return createApiClient(
      () => token,
      () => {
        setAuth({ token: "", user: null });
        showToast("Session expired. Please sign in again.", "error");
      },
      setPingMs
    );
  }, [token]);

  // Auth Actions
  const handleLoginSuccess = async (newAccessToken, newUser) => {
    saveAuth(newAccessToken, newUser);
    setAuth({ token: newAccessToken, user: newUser });
    showToast(`Welcome, ${newUser.fullName}!`);
    await loadOrganizations(newAccessToken);
    navigate("/overview");
  };

  const handleLogout = () => {
    clearAuth();
    setAuth({ token: "", user: null });
    setActiveOrg(null);
    setOrganizations([]);
    showToast("Signed out successfully", "info");
  };

  // Load Organizations
  const loadOrganizations = async (authToken = token) => {
    try {
      const res = await fetch(`${window.location.origin}/api/v1/organizations`, {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      const data = await res.json();
      if (data.success && data.organizations?.length > 0) {
        setOrganizations(data.organizations);
        const savedOrgId = localStorage.getItem("upieasy_active_org_id");
        const def = (savedOrgId && data.organizations.find(o => o.id === savedOrgId)) || data.organizations[0];
        setActiveOrg(def);
      }
    } catch (err) {
      console.error(err);
    }
  };

  const handleSelectOrg = (org) => {
    setActiveOrg(org);
    localStorage.setItem("upieasy_active_org_id", org.id);
  };

  useEffect(() => {
    if (token) loadOrganizations();
  }, [token]);

  // Tab Loaders
  const loadOverview = async () => {
    try {
      const data = await apiFetch(`/api/v1/organizations/${activeOrg.id}/dashboard`);
      if (data.success) setDashboardStats(data.dashboard);
    } catch {}
  };

  const loadTransactions = async (silent = false) => {
    if (!silent) setTxnLoading(true);
    try {
      let url = `/api/v1/organizations/${activeOrg.id}/transactions?limit=50`;
      if (txnStatus) url += `&status=${txnStatus}`;
      if (txnSearch) url += `&search=${encodeURIComponent(txnSearch)}`;
      const data = await apiFetch(url);
      if (data.success) setTransactions(data.transactions || []);
    } catch (err) {
      if (!silent) showToast(err.message, "error");
    } finally {
      if (!silent) setTxnLoading(false);
    }
  };

  const loadUpi = async () => {
    try {
      const data = await apiFetch(`/api/v1/organizations/${activeOrg.id}/upi`);
      if (data.success) setUpiAccounts(data.upiAccounts || []);
    } catch (err) {
      showToast(err.message, "error");
    }
  };

  const loadStaff = async () => {
    try {
      const [staffRes, invitesRes] = await Promise.all([
        apiFetch(`/api/v1/organizations/${activeOrg.id}/staff`),
        apiFetch(`/api/v1/organizations/${activeOrg.id}/invites`),
      ]);
      if (staffRes.success) setStaffList(staffRes.staff || []);
      if (invitesRes.success) setInvitesList(invitesRes.invites || []);
    } catch (err) {
      showToast(err.message, "error");
    }
  };

  const loadAccounts = async () => {
    try {
      const data = await apiFetch(`/api/v1/organizations/${activeOrg.id}/accounts`);
      if (data.success) setBankAccounts(data.accounts || []);
    } catch (err) {
      showToast(err.message, "error");
    }
  };

  const loadTables = async () => {
    try {
      const data = await apiFetch("/api/v1/admin/tables");
      if (data.success) {
        setAdminTables(data.tables || []);
        if (data.tables?.length > 0 && !selectedTable) {
          setSelectedTable(data.tables[0].name);
        }
      }
    } catch (err) {
      showToast(err.message, "error");
    }
  };

  const loadTableData = async () => {
    setTableLoading(true);
    try {
      let url = `/api/v1/admin/tables/${selectedTable}?limit=25&offset=${tableOffset}`;
      if (tableSearch) url += `&search=${encodeURIComponent(tableSearch)}`;
      const data = await apiFetch(url);
      if (data.success) setTableData(data);
    } catch (err) {
      showToast(err.message, "error");
    } finally {
      setTableLoading(false);
    }
  };

  const loadHealth = async () => {
    try {
      const data = await apiFetch("/api/v1/admin/health");
      if (data.success) setHealthData(data);
    } catch (err) {
      showToast(err.message, "error");
    }
  };

  // Route & Tenant Change Listener
  useEffect(() => {
    if (!token || !activeOrg) return;
    if (activeTab === "overview") loadOverview();
    else if (activeTab === "transactions") loadTransactions();
    else if (activeTab === "upi") loadUpi();
    else if (activeTab === "staff") loadStaff();
    else if (activeTab === "accounts") loadAccounts();
    else if (activeTab === "tables") loadTables();
    else if (activeTab === "health") loadHealth();
  }, [token, activeOrg, activeTab]);

  useEffect(() => {
    if (activeTab === "tables" && selectedTable) {
      loadTableData();
    }
  }, [activeTab, selectedTable, tableSearch, tableOffset]);

  // Real-Time Live Sync (every 5 seconds when visible)
  useEffect(() => {
    if (!token || !activeOrg) return;
    let isMounted = true;
    const interval = setInterval(async () => {
      if (document.visibilityState !== "visible") return;
      try {
        setIsSyncing(true);
        if (activeTab === "overview") await loadOverview();
        else if (activeTab === "transactions") await loadTransactions(true);
        else if (activeTab === "health") await loadHealth();
      } catch {
      } finally {
        if (isMounted) setIsSyncing(false);
      }
    }, 5000);
    return () => {
      isMounted = false;
      clearInterval(interval);
    };
  }, [token, activeOrg, activeTab]);

  // Window Focus Auto-Sync
  useEffect(() => {
    const onFocus = () => {
      if (token && activeOrg) {
        if (activeTab === "overview") loadOverview();
        else if (activeTab === "transactions") loadTransactions(true);
        else if (activeTab === "health") loadHealth();
      }
    };
    window.addEventListener("focus", onFocus);
    return () => window.removeEventListener("focus", onFocus);
  }, [token, activeOrg, activeTab]);

  // Mobile Bottom Sheet Action Handlers
  const handleSelectTxnAction = (txn) => {
    setBottomSheetConfig({
      title: `Transaction ${txn.referenceNumber || txn.id.slice(0, 8)}`,
      subtitle: `₹${Number(txn.amount).toFixed(2)} · ${txn.status}`,
      actions: [
        {
          label: "View Full Audit Payload",
          icon: IconEye,
          onClick: () => setInspectTxn(txn),
        },
        {
          label: "Copy UTR Reference",
          icon: IconCopy,
          onClick: () => {
            navigator.clipboard.writeText(txn.referenceNumber || txn.id);
            showToast("UTR reference copied!");
          },
        },
        {
          label: "Issue Refund",
          icon: IconArrowUpRight,
          onClick: () => showToast("Refund initiated to customer account"),
        },
      ],
    });
  };

  const handleSelectUpiAction = (upi, mode = "menu") => {
    if (mode === "qr") {
      setShowQrModal(upi);
      return;
    }
    setBottomSheetConfig({
      title: upi.payeeName,
      subtitle: upi.vpa,
      actions: [
        {
          label: "Generate Counter QR Code",
          icon: IconQrCode,
          onClick: () => setShowQrModal(upi),
        },
        {
          label: "Edit UPI Account Details",
          icon: IconEdit,
          onClick: () => setShowUpiModal(upi),
        },
        {
          label: upi.isDefault ? "Unset Primary" : "Set as Primary Default",
          icon: IconStar,
          variant: "success",
          onClick: async () => {
            try {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/upi/${upi.id}`, {
                method: "PATCH",
                body: JSON.stringify({ isDefault: !upi.isDefault }),
              });
              showToast("UPI default status updated!");
              loadUpi();
            } catch (err) {
              showToast(err.message, "error");
            }
          },
        },
        {
          label: "Delete UPI ID",
          icon: IconTrash2,
          variant: "danger",
          onClick: async () => {
            if (!confirm(`Delete UPI VPA ${upi.vpa}?`)) return;
            try {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/upi/${upi.id}`, { method: "DELETE" });
              showToast("UPI Account removed");
              loadUpi();
            } catch (err) {
              showToast(err.message, "error");
            }
          },
        },
      ],
    });
  };

  const handleSelectStaffAction = (member) => {
    setBottomSheetConfig({
      title: member.fullName || member.mobileNumber,
      subtitle: `Role: ${member.role} · Status: ${member.status}`,
      actions: [
        {
          label: "Edit Assigned Role & Permissions",
          icon: IconEdit,
          onClick: () => setShowStaffModal(member),
        },
        {
          label: member.status === "ACTIVE" ? "Suspend Member Access" : "Activate Member Access",
          icon: IconLock,
          variant: member.status === "ACTIVE" ? "danger" : "success",
          onClick: async () => {
            const nextStatus = member.status === "ACTIVE" ? "SUSPENDED" : "ACTIVE";
            try {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/staff/${member.id}`, {
                method: "PATCH",
                body: JSON.stringify({ status: nextStatus }),
              });
              showToast(`Staff access set to ${nextStatus}`);
              loadStaff();
            } catch (err) {
              showToast(err.message, "error");
            }
          },
        },
        {
          label: "Remove Member from Store",
          icon: IconTrash2,
          variant: "danger",
          onClick: async () => {
            if (!confirm(`Remove ${member.fullName || member.mobileNumber} from organization?`)) return;
            try {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/staff/${member.id}`, { method: "DELETE" });
              showToast("Staff member removed");
              loadStaff();
            } catch (err) {
              showToast(err.message, "error");
            }
          },
        },
      ],
    });
  };

  const handleSelectTableRowAction = (row, table, columns) => {
    const pkCol = columns.find(c => c.isPrimary)?.name || 'id';
    const pkVal = row[pkCol];
    setBottomSheetConfig({
      title: `${table} Record`,
      subtitle: `Primary Key (${pkCol}): ${pkVal}`,
      actions: [
        {
          label: "Edit Row Fields",
          icon: IconEdit,
          onClick: () => setShowTableRowModal({ mode: "edit", row }),
        },
        {
          label: "Copy Row as JSON",
          icon: IconCopy,
          onClick: () => {
            navigator.clipboard.writeText(JSON.stringify(row, null, 2));
            showToast("Copied row JSON to clipboard");
          },
        },
        {
          label: "Delete Record Permanently",
          icon: IconTrash2,
          variant: "danger",
          onClick: async () => {
            if (!confirm(`Delete record with ${pkCol}=${pkVal} from ${table}?`)) return;
            try {
              await apiFetch(`/api/v1/admin/tables/${table}/${pkVal}`, { method: "DELETE" });
              showToast("Record deleted successfully!");
              loadTables();
            } catch (err) {
              showToast(err.message, "error");
            }
          },
        },
      ],
    });
  };

  const handleOpenMoreSheet = () => {
    setBottomSheetConfig({
      title: "More Features & Settings",
      subtitle: "Management & Diagnostics",
      actions: [
        { label: "Settlement Bank Accounts", icon: IconLandmark, onClick: () => navigate("/accounts") },
        { label: "Business Profile & Registration", icon: IconBuilding, onClick: () => navigate("/orgs") },
        { label: "Database Table Explorer (Admin)", icon: IconDatabase, onClick: () => navigate("/tables") },
        { label: "System Health Diagnostics", icon: IconHeartPulse, onClick: () => navigate("/health") },
      ],
    });
  };

  // If unauthenticated, show Google Login Page
  if (!token) {
    return (
      <LoginPage 
        onLoginSuccess={handleLoginSuccess}
        theme={theme}
        onToggleTheme={() => setTheme(prev => prev === "dark" ? "light" : "dark")}
        pingMs={pingMs}
      />
    );
  }

  return (
    <div className="min-h-screen flex flex-col bg-background text-foreground transition-colors">
      <Navbar 
        user={user}
        organizations={organizations}
        activeOrg={activeOrg}
        onSelectOrg={handleSelectOrg}
        onLogout={handleLogout}
        theme={theme}
        onToggleTheme={() => setTheme(prev => prev === "dark" ? "light" : "dark")}
        pingMs={pingMs}
        isSyncing={isSyncing}
      />

      <div className="flex-1 flex overflow-hidden">
        <Sidebar 
          activeTab={activeTab}
          onSelectTab={(tabId) => navigate(`/${tabId}`)}
          activeOrg={activeOrg}
        />

        <main className="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto pb-24 md:pb-8">
          <Suspense fallback={<SuspenseFallback activeTab={activeTab} />}>
            <Routes>
              <Route path="/overview" element={
                <OverviewPage 
                  stats={dashboardStats}
                  onOpenNewTxn={() => setShowNewTxnModal(true)}
                  onOpenNewUpi={() => setShowUpiModal({})}
                  onNavigate={(tab) => navigate(`/${tab}`)}
                  onInspectTxn={handleSelectTxnAction}
                />
              } />

              <Route path="/transactions" element={
                <TransactionsPage 
                  transactions={transactions}
                  loading={txnLoading}
                  onRefresh={loadTransactions}
                  search={txnSearch}
                  onSearchChange={setTxnSearch}
                  status={txnStatus}
                  onStatusChange={setTxnStatus}
                  onOpenNewTxn={() => setShowNewTxnModal(true)}
                  onSelectTxnAction={handleSelectTxnAction}
                />
              } />

              <Route path="/upi" element={
                <UpiPage 
                  upiAccounts={upiAccounts}
                  onOpenNewUpi={() => setShowUpiModal({})}
                  onSelectUpiAction={handleSelectUpiAction}
                />
              } />

              <Route path="/staff" element={
                <StaffPage 
                  staffList={staffList}
                  invitesList={invitesList}
                  onOpenInviteStaff={() => setShowStaffModal({})}
                  onSelectStaffAction={handleSelectStaffAction}
                />
              } />

              <Route path="/accounts" element={
                <AccountsPage 
                  bankAccounts={bankAccounts}
                  onOpenNewBank={() => setShowNewBankModal(true)}
                />
              } />

              <Route path="/orgs" element={
                <ProfilePage 
                  activeOrg={activeOrg}
                  onSaveProfile={async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    try {
                      await apiFetch(`/api/v1/organizations/${activeOrg.id}`, {
                        method: "PATCH",
                        body: JSON.stringify({
                          name: form.name.value,
                          legalBusinessName: form.legalBusinessName.value,
                          category: form.category.value,
                          gstin: form.gstin.value || null,
                          panNumber: form.panNumber.value || null,
                        }),
                      });
                      showToast("Profile saved successfully");
                      loadOrganizations();
                    } catch (err) {
                      showToast(err.message, "error");
                    }
                  }}
                />
              } />

              <Route path="/tables" element={
                <ProtectedRoute isAuthenticated={Boolean(token)} userRole={activeOrg?.role} requiredRole="MANAGER">
                  <TablesPage 
                    tables={adminTables}
                    selectedTable={selectedTable}
                    onSelectTable={(t) => {
                      setSelectedTable(t);
                      setTableOffset(0);
                      setTableSearch("");
                    }}
                    tableData={tableData}
                    loading={tableLoading}
                    search={tableSearch}
                    onSearchChange={setTableSearch}
                    onOpenInsertModal={() => setShowTableRowModal({ mode: "insert" })}
                    onSelectRowAction={handleSelectTableRowAction}
                  />
                </ProtectedRoute>
              } />

              <Route path="/health" element={
                <HealthPage 
                  healthData={healthData}
                  pingMs={pingMs}
                  onRefresh={loadHealth}
                  onResetSeed={async () => {
                    try {
                      await apiFetch("/api/v1/admin/seed", { method: "POST" });
                      showToast("Database baseline re-seeded successfully!");
                      loadOverview();
                    } catch (err) {
                      showToast(err.message, "error");
                    }
                  }}
                />
              } />

              <Route path="*" element={
                <OverviewPage 
                  stats={dashboardStats}
                  onOpenNewTxn={() => setShowNewTxnModal(true)}
                  onOpenNewUpi={() => setShowUpiModal({})}
                  onNavigate={(tab) => navigate(`/${tab}`)}
                  onInspectTxn={handleSelectTxnAction}
                />
              } />
            </Routes>
          </Suspense>
        </main>
      </div>

      <BottomNav 
        activeTab={activeTab}
        onSelectTab={(tabId) => navigate(`/${tabId}`)}
        onOpenMoreSheet={handleOpenMoreSheet}
      />

      <BottomSheet 
        isOpen={Boolean(bottomSheetConfig)}
        onClose={() => setBottomSheetConfig(null)}
        title={bottomSheetConfig?.title || "Options"}
        subtitle={bottomSheetConfig?.subtitle}
        actions={bottomSheetConfig?.actions || []}
      />

      {/* Extracted Modular Modals */}
      <RecordPaymentModal
        isOpen={showNewTxnModal}
        onClose={() => setShowNewTxnModal(false)}
        activeOrg={activeOrg}
        defaultVpa={upiAccounts[0]?.vpa || `${activeOrg?.id}@upieasy`}
        onSubmitPayment={async (e) => {
          e.preventDefault();
          const form = e.target;
          try {
            await apiFetch(`/api/v1/organizations/${activeOrg.id}/transactions`, {
              method: "POST",
              body: JSON.stringify({
                amount: parseFloat(form.amount.value),
                payerName: form.payerName.value || "Customer",
                payerVpa: form.payerVpa.value || "customer@upi",
                payeeName: activeOrg.name,
                payeeVpa: upiAccounts[0]?.vpa || `${activeOrg.id}@upieasy`,
                note: form.note.value || "Counter Sale",
                direction: "RECEIVED",
                source: "UPI_INTENT",
              }),
            });
            showToast("Payment recorded successfully!");
            setShowNewTxnModal(false);
            loadOverview();
            if (activeTab === "transactions") loadTransactions();
          } catch (err) {
            showToast(err.message, "error");
          }
        }}
      />

      <UpiAccountModal
        isOpen={Boolean(showUpiModal)}
        onClose={() => setShowUpiModal(null)}
        initialData={showUpiModal?.id ? showUpiModal : null}
        activeOrg={activeOrg}
        onSubmitUpi={async (e) => {
          e.preventDefault();
          const form = e.target;
          const isEditing = Boolean(showUpiModal?.id);
          const payload = {
            vpa: form.vpa.value.trim().toLowerCase(),
            payeeName: form.payeeName.value.trim(),
            merchantCategoryCode: form.mcc.value || "5411",
            isDefault: form.isDefault.checked,
          };
          try {
            if (isEditing) {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/upi/${showUpiModal.id}`, {
                method: "PATCH",
                body: JSON.stringify(payload),
              });
              showToast("UPI details updated!");
            } else {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/upi`, {
                method: "POST",
                body: JSON.stringify(payload),
              });
              showToast("UPI Account added!");
            }
            setShowUpiModal(null);
            loadUpi();
          } catch (err) {
            showToast(err.message, "error");
          }
        }}
      />

      <QrCodeModal
        upiAccount={showQrModal}
        onClose={() => setShowQrModal(null)}
        onCopyLink={(link) => {
          navigator.clipboard.writeText(link);
          showToast("Copied payment link to clipboard");
        }}
      />

      <StaffModal
        isOpen={Boolean(showStaffModal)}
        onClose={() => setShowStaffModal(null)}
        initialData={showStaffModal?.id ? showStaffModal : null}
        onSubmitStaff={async (e) => {
          e.preventDefault();
          const form = e.target;
          const isEditing = Boolean(showStaffModal?.id);
          try {
            if (isEditing) {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/staff/${showStaffModal.id}`, {
                method: "PATCH",
                body: JSON.stringify({ role: form.role.value, status: form.status.value }),
              });
              showToast("Staff updated successfully!");
            } else {
              await apiFetch(`/api/v1/organizations/${activeOrg.id}/staff/invite`, {
                method: "POST",
                body: JSON.stringify({
                  mobileNumber: form.mobile.value.trim(),
                  name: form.name.value.trim(),
                  email: form.email.value.trim() || undefined,
                  role: form.role.value,
                }),
              });
              showToast("Staff member added successfully!");
            }
            setShowStaffModal(null);
            loadStaff();
          } catch (err) {
            showToast(err.message, "error");
          }
        }}
      />

      <BankAccountModal
        isOpen={showNewBankModal}
        onClose={() => setShowNewBankModal(false)}
        activeOrg={activeOrg}
        onSubmitBank={async (e) => {
          e.preventDefault();
          const form = e.target;
          try {
            await apiFetch(`/api/v1/organizations/${activeOrg.id}/accounts`, {
              method: "POST",
              body: JSON.stringify({
                bankName: form.bankName.value.trim(),
                accountHolderName: form.holderName.value.trim(),
                accountNumber: form.accountNumber.value.trim(),
                ifscCode: form.ifsc.value.trim().toUpperCase(),
                accountType: form.type.value,
              }),
            });
            showToast("Bank account linked!");
            setShowNewBankModal(false);
            loadAccounts();
          } catch (err) {
            showToast(err.message, "error");
          }
        }}
      />

      <TableRowModal
        isOpen={Boolean(showTableRowModal)}
        onClose={() => setShowTableRowModal(null)}
        selectedTable={selectedTable}
        columns={tableData?.columns || []}
        initialRow={showTableRowModal?.mode === "edit" ? showTableRowModal.row : null}
        onSubmitRow={async (e) => {
          e.preventDefault();
          const form = e.target;
          const isEditing = showTableRowModal?.mode === "edit";
          try {
            if (isEditing) {
              const updates = {};
              tableData.columns.forEach(col => {
                if (!col.isPrimary && form[col.name]) updates[col.name] = form[col.name].value;
              });
              const pkCol = tableData.columns.find(c => c.isPrimary)?.name || 'id';
              const pkVal = showTableRowModal.row[pkCol];
              await apiFetch(`/api/v1/admin/tables/${selectedTable}/${pkVal}`, {
                method: "PATCH",
                body: JSON.stringify(updates),
              });
              showToast("Record updated successfully!");
            } else {
              const newRow = {};
              tableData.columns.forEach(col => {
                if (form[col.name] && form[col.name].value !== "") newRow[col.name] = form[col.name].value;
              });
              await apiFetch(`/api/v1/admin/tables/${selectedTable}`, {
                method: "POST",
                body: JSON.stringify(newRow),
              });
              showToast("Record inserted successfully!");
            }
            setShowTableRowModal(null);
            loadTables();
          } catch (err) {
            showToast(err.message, "error");
          }
        }}
      />

      <TransactionDetailModal
        transaction={inspectTxn}
        onClose={() => setInspectTxn(null)}
      />

      {/* Global Notification Toast */}
      {toast && (
        <div className="fixed bottom-20 md:bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl border border-border bg-card shadow-2xl animate-fade-in text-xs font-semibold text-card-foreground">
          <div className={`w-2 h-2 rounded-full ${
            toast.type === 'error' ? 'bg-destructive' : toast.type === 'info' ? 'bg-blue-500' : 'bg-emerald-500'
          }`}></div>
          <span>{toast.message}</span>
          <button onClick={() => setToast(null)} className="ml-2 text-muted-foreground hover:text-foreground">✕</button>
        </div>
      )}
    </div>
  );
}

function App() {
  return (
    <Router>
      <AppContent />
    </Router>
  );
}



// React Root Initialization
const rootElement = document.getElementById('root');
if (rootElement && typeof ReactDOM !== 'undefined') {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}


  </script>
</body>
</html>
