    function App() {
      const [selectedVersion, setSelectedVersion] = useState("v1");
      const [selectedModule, setSelectedModule] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [methodFilter, setMethodFilter] = useState("ALL");
      const [expandedRoutes, setExpandedRoutes] = useState({});
      
      const [authToken, setAuthToken] = useState(() => localStorage.getItem("upi_token") || "");
      const [orgId, setOrgId] = useState(() => localStorage.getItem("upi_org") || "");
      const [testOutputs, setTestOutputs] = useState({});
      const [loadingRoute, setLoadingRoute] = useState(null);

      const handleTokenChange = (e) => {
        setAuthToken(e.target.value);
        localStorage.setItem("upi_token", e.target.value);
      };

      const handleOrgChange = (e) => {
        setOrgId(e.target.value);
        localStorage.setItem("upi_org", e.target.value);
      };

      const toggleRoute = (id) => {
        setExpandedRoutes(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const currentVersionData = useMemo(() => {
        return API_DATA.versions.find(v => v.id === selectedVersion) || API_DATA.versions[0];
      }, [selectedVersion]);

      const allRoutes = useMemo(() => {
        const routes = [];
        API_DATA.versions.forEach(ver => {
          ver.modules.forEach(mod => {
            mod.routes.forEach(r => {
              routes.push({ ...r, versionId: ver.id, moduleName: mod.name, moduleId: mod.id });
            });
          });
        });
        return routes;
      }, []);

      const filteredRoutes = useMemo(() => {
        return allRoutes.filter(r => {
          const matchVersion = selectedVersion === "ALL" || r.versionId === selectedVersion;
          const matchModule = !selectedModule || r.moduleId === selectedModule;
          const matchMethod = methodFilter === "ALL" || r.method === methodFilter;
          const matchQuery = !searchQuery || 
            r.path.toLowerCase().includes(searchQuery.toLowerCase()) ||
            r.summary.toLowerCase().includes(searchQuery.toLowerCase()) ||
            r.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
            r.moduleName.toLowerCase().includes(searchQuery.toLowerCase());
          return matchVersion && matchModule && matchMethod && matchQuery;
        });
      }, [allRoutes, selectedVersion, selectedModule, methodFilter, searchQuery]);

      const executeTest = async (r) => {
        setLoadingRoute(r.id);
        const resolvedOrg = orgId.trim() || "org_demo123";
        let targetPath = r.path.replace(":id", resolvedOrg).replace(":provider", "RAZORPAY");

        const headers = {};
        if (r.headers) {
          r.headers.forEach(h => {
            if (h.name === "Content-Type") headers["Content-Type"] = h.val;
          });
        }
        if (authToken.trim()) {
          headers["Authorization"] = authToken.startsWith("Bearer ") ? authToken : "Bearer " + authToken;
        }
        if (resolvedOrg) {
          headers["X-Organization-Id"] = resolvedOrg;
        }

        let body = null;
        if (r.body) {
          headers["Content-Type"] = "application/json";
          const editor = document.getElementById("payload-" + r.id);
          body = editor ? editor.value : JSON.stringify(r.body);
        }

        const start = performance.now();
        try {
          const res = await fetch(targetPath, {
            method: r.method,
            headers,
            body
          });
          const duration = Math.round(performance.now() - start);
          const json = await res.json().catch(() => ({ message: res.statusText }));
          setTestOutputs(prev => ({
            ...prev,
            [r.id]: {
              status: res.status + " " + res.statusText,
              ok: res.ok,
              time: duration,
              data: json
            }
          }));
        } catch (err) {
          const duration = Math.round(performance.now() - start);
          setTestOutputs(prev => ({
            ...prev,
            [r.id]: {
              status: "Network Error",
              ok: false,
              time: duration,
              data: { error: err.message }
            }
          }));
        } finally {
          setLoadingRoute(null);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header Bar */}
          <header className="sticky top-0 z-50 backdrop-blur-xl bg-gray-950/80 border-b border-gray-800/80 px-6 py-3.5">
            <div className="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center font-extrabold text-xl shadow-lg shadow-indigo-500/20 text-white">
                  ⚡
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight text-white flex items-center gap-2">

                    <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/30">React Console</span>
                  </h1>
                  <p className="text-xs text-gray-400">Cloudflare Workers • Multi-Tenant Hono • Version Tree Explorer</p>
                </div>
              </div>

              {/* Status & Auth Config */}
              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Worker Live
                </div>

                <div className="flex items-center gap-2 bg-black/40 border border-gray-800 rounded-lg px-3 py-1 text-xs">
                  <span className="text-gray-400 font-medium">Auth Token:</span>
                  <input
                    type="password"
                    placeholder="Bearer JWT..."
                    value={authToken}
                    onChange={handleTokenChange}
                    className="bg-transparent font-mono text-gray-200 outline-none w-32 focus:w-48 transition-all"
                  />
                </div>

                <div className="flex items-center gap-2 bg-black/40 border border-gray-800 rounded-lg px-3 py-1 text-xs">
                  <span className="text-gray-400 font-medium">Org ID:</span>
                  <input
                    type="text"
                    placeholder="org_..."
                    value={orgId}
                    onChange={handleOrgChange}
                    className="bg-transparent font-mono text-gray-200 outline-none w-24 focus:w-36 transition-all"
                  />
                </div>
              </div>
            </div>
          </header>

          {/* Main Layout: Sidebar Tree + Content */}
          <div className="max-w-[1600px] mx-auto w-full flex-1 flex flex-col md:flex-row gap-6 p-6">
            {/* Version-Wise Tree Sidebar */}
            <aside className="w-full md:w-80 shrink-0 flex flex-col gap-4">
              <div className="bg-gray-900/60 backdrop-blur-md border border-gray-800/80 rounded-2xl p-4 sticky top-24">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-400">Version Tree</h3>
                  <span className="text-xs font-mono bg-gray-800 text-gray-400 px-2 py-0.5 rounded-md">
                    {filteredRoutes.length} endpoints
                  </span>
                </div>

                {/* Version Selector Tabs */}
                <div className="flex gap-1.5 p-1 bg-black/40 rounded-xl mb-4 border border-gray-800/60">
                  {API_DATA.versions.map(v => (
                    <button
                      key={v.id}
                      onClick={() => { setSelectedVersion(v.id); setSelectedModule(null); }}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${
                        selectedVersion === v.id
                          ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
                          : "text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      {v.id.toUpperCase()}
                    </button>
                  ))}
                  <button
                    onClick={() => { setSelectedVersion("ALL"); setSelectedModule(null); }}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${
                      selectedVersion === "ALL"
                        ? "bg-indigo-600 text-white shadow-md"
                        : "text-gray-400 hover:text-gray-200"
                    }`}
                  >
                    ALL
                  </button>
                </div>

                {/* Tree Modules List */}
                <div className="space-y-1 max-h-[calc(100vh-280px)] overflow-y-auto pr-1">
                  <button
                    onClick={() => setSelectedModule(null)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-colors ${
                      selectedModule === null
                        ? "bg-indigo-500/10 text-indigo-300 border border-indigo-500/30"
                        : "text-gray-400 hover:bg-gray-800/50 hover:text-gray-200"
                    }`}
                  >
                    <span className="flex items-center gap-2">
                      <span>📁</span> All Modules
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-gray-800">
                      {selectedVersion === "ALL" 
                        ? allRoutes.length 
                        : currentVersionData.modules.reduce((acc, m) => acc + m.routes.length, 0)}
                    </span>
                  </button>

                  {(selectedVersion === "ALL" ? API_DATA.versions.flatMap(v => v.modules) : currentVersionData.modules).map(m => (
                    <button
                      key={m.id}
                      onClick={() => setSelectedModule(selectedModule === m.id ? null : m.id)}
                      className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-colors ${
                        selectedModule === m.id
                          ? "bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-semibold"
                          : "text-gray-400 hover:bg-gray-800/50 hover:text-gray-200"
                      }`}
                    >
                      <span className="flex items-center gap-2 truncate">
                        <span>🏷️</span> {m.name}
                      </span>
                      <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-gray-800/80">
                        {m.routes.length}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 flex flex-col gap-6 min-w-0">
              {/* Search & Filter Controls */}
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex-1 min-w-[280px] relative">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search routes by path, method, name, or description..."
                    className="w-full bg-gray-900/70 border border-gray-800 rounded-xl px-4 py-2.5 pl-10 text-sm text-gray-100 placeholder-gray-500 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                  />
                  <span className="absolute left-3.5 top-3 text-gray-500">🔍</span>
                </div>

                {/* HTTP Method Filter Pills */}
                <div className="flex items-center gap-1.5 bg-gray-900/70 p-1 border border-gray-800 rounded-xl">
                  {["ALL", "GET", "POST", "PATCH", "DELETE"].map(m => (
                    <button
                      key={m}
                      onClick={() => setMethodFilter(m)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        methodFilter === m
                          ? "bg-indigo-600 text-white shadow-sm"
                          : "text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      {m}
                    </button>
                  ))}
                </div>
              </div>

              {/* Endpoints List */}
              {filteredRoutes.length === 0 ? (
                <div className="bg-gray-900/40 border border-gray-800 rounded-2xl p-12 text-center text-gray-400">
                  <p className="text-base font-semibold">No API endpoints match your current filter.</p>
                  <button 
                    onClick={() => { setSearchQuery(""); setMethodFilter("ALL"); setSelectedModule(null); }}
                    className="mt-3 text-xs text-indigo-400 hover:underline"
                  >
                    Reset all filters
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {filteredRoutes.map(r => {
                    const isOpen = !!expandedRoutes[r.id];
                    const testResult = testOutputs[r.id];
                    const isLoading = loadingRoute === r.id;

                    const methodColor = {
                      GET: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
                      POST: "bg-indigo-500/10 text-indigo-400 border-indigo-500/30",
                      PATCH: "bg-amber-500/10 text-amber-400 border-amber-500/30",
                      DELETE: "bg-rose-500/10 text-rose-400 border-rose-500/30"
                    }[r.method] || "bg-gray-800 text-gray-300";

                    return (
                      <div 
                        key={r.id}
                        className="bg-gray-900/60 backdrop-blur-md border border-gray-800/80 hover:border-gray-700/80 rounded-2xl overflow-hidden transition-all shadow-sm"
                      >
                        {/* Header Row */}
                        <div 
                          onClick={() => toggleRoute(r.id)}
                          className="p-4 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none"
                        >
                          <div className="flex items-center gap-3 min-w-0">
                            <span className={`px-2.5 py-1 rounded-md text-xs font-mono font-bold border ${methodColor}`}>
                              {r.method}
                            </span>
                            <span className="font-mono text-sm font-semibold text-gray-100 truncate">
                              {r.path}
                            </span>
                            <span className="text-xs text-gray-400 hidden sm:inline">
                              • {r.summary}
                            </span>
                          </div>

                          <div className="flex items-center gap-2">
                            <span className="text-[11px] font-semibold text-gray-400 bg-gray-800/70 px-2 py-0.5 rounded">
                              {r.moduleName}
                            </span>
                            <span className="text-xs text-gray-500 transition-transform duration-200">
                              {isOpen ? "▲" : "▼"}
                            </span>
                          </div>
                        </div>

                        {/* Collapsible Details & Console */}
                        {isOpen && (
                          <div className="p-5 border-t border-gray-800/80 bg-black/20 space-y-4">
                            <p className="text-sm text-gray-300">{r.desc}</p>

                            {/* Props & Parameters */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              {r.headers.length > 0 && (
                                <div className="bg-black/40 border border-gray-800 rounded-xl p-3.5">
                                  <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Required Headers</h4>
                                  <ul className="space-y-1.5 text-xs font-mono">
                                    {r.headers.map((h, i) => (
                                      <li key={i} className="flex justify-between">
                                        <span className="text-indigo-300 font-semibold">{h.name}</span>
                                        <span className="text-gray-400">{h.val}</span>
                                      </li>
                                    ))}
                                  </ul>
                                </div>
                              )}

                              {r.params.length > 0 && (
                                <div className="bg-black/40 border border-gray-800 rounded-xl p-3.5">
                                  <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">URL Parameters</h4>
                                  <ul className="space-y-1.5 text-xs font-mono">
                                    {r.params.map((p, i) => (
                                      <li key={i} className="flex justify-between">
                                        <span className="text-cyan-300">{p.name} {p.req ? <span className="text-rose-400">*</span> : ""}</span>
                                        <span className="text-gray-400">{p.desc}</span>
                                      </li>
                                    ))}
                                  </ul>
                                </div>
                              )}
                            </div>

                            {/* Testing Console */}
                            <div className="border border-gray-800/90 rounded-xl p-4 bg-gray-950/70 space-y-3">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-cyan-400 uppercase tracking-wider">Live Request Runner</span>
                                <span className="text-xs text-gray-400 font-mono">
                                  {r.auth ? "🔒 Protected (" + r.role + ")" : "🌐 Public"}
                                </span>
                              </div>

                              {r.body && (
                                <div>
                                  <label className="text-[11px] font-semibold text-gray-400 mb-1 block">Request Body (JSON):</label>
                                  <textarea
                                    id={"payload-" + r.id}
                                    defaultValue={JSON.stringify(r.body, null, 2)}
                                    rows="4"
                                    className="w-full bg-black/60 border border-gray-800 rounded-lg p-2.5 font-mono text-xs text-indigo-200 outline-none focus:border-indigo-500 transition-colors"
                                  />
                                </div>
                              )}

                              <div className="flex items-center gap-3">
                                <button
                                  disabled={isLoading}
                                  onClick={() => executeTest(r)}
                                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 rounded-lg text-xs font-bold text-white transition-all shadow-md flex items-center gap-2"
                                >
                                  <span>{isLoading ? "Executing..." : "Send Request"}</span>
                                  <span>▶</span>
                                </button>
                              </div>

                              {/* Output Console */}
                              {testResult && (
                                <div className="mt-3 pt-3 border-t border-gray-800/80 space-y-2">
                                  <div className="flex items-center gap-3 text-xs">
                                    <span className={`font-bold ${testResult.ok ? "text-emerald-400" : "text-rose-400"}`}>
                                      {testResult.status}
                                    </span>
                                    <span className="text-gray-400">{testResult.time} ms</span>
                                  </div>
                                  <pre className="bg-black/80 border border-gray-800/80 rounded-lg p-3 text-xs font-mono text-indigo-300 max-h-48 overflow-y-auto whitespace-pre-wrap word-break-all">
                                    {JSON.stringify(testResult.data, null, 2)}
                                  </pre>
                                </div>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
