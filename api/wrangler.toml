name = "upi-easy-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
JWT_EXPIRY = "7d"
REFRESH_TOKEN_EXPIRY = "30d"
GOOGLE_WEB_CLIENT_ID = "332345540842-ks8bq4csr4lklkvv3tesgkig2b221m23.apps.googleusercontent.com"
API_BASE_URL = "https://upi-easy-api.aerotech.workers.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "upi_easy_db"
database_name = "upi-easy-db"
database_id = "fa5f4600-8c4b-4513-b828-d95b21b3f54b"
migrations_dir = "drizzle"